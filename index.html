<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sertaç Türe</title><style>html,body{margin:0;background:#0e1411;color:#fff;font-family:system-ui,sans-serif}.boot{min-height:100vh;display:grid;place-items:center}.boot span{opacity:.7}</style></head><body><div class="boot"><span>Site hazırlanıyor…</span></div><script>
const CLIP_STYLE=`<style>
.clips-v9{width:min(1180px,calc(100% - 44px));margin:0 auto;padding:34px 0 10px;color:#fff}.clips-v9-head{display:flex;align-items:end;justify-content:space-between;gap:28px;margin-bottom:20px;padding-top:28px;border-top:1px solid rgba(255,255,255,.12)}.clips-v9 .eyebrow{display:inline-flex;align-items:center;gap:10px;font:600 11px/1 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.16em;color:#f0b47e}.clips-v9 h3{font-family:'Playfair Display',serif;font-size:clamp(30px,4vw,52px);line-height:1;margin:10px 0 0}.clips-v9-head p{max-width:470px;margin:0;color:rgba(255,255,255,.62);line-height:1.75}.clip-v9-card{position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.10);border-radius:28px;background:#151d18;box-shadow:0 34px 90px rgba(0,0,0,.30)}.clip-v9-frame{aspect-ratio:16/9;background:#050706;overflow:hidden}.clip-v9-frame video{width:100%;height:100%;object-fit:contain;background:#050706;display:block}.clip-v9-meta{display:flex;justify-content:space-between;gap:20px;align-items:center;padding:18px 22px}.clip-v9-meta strong{font-size:16px}.clip-v9-meta span{font:500 12px/1.3 'JetBrains Mono',monospace;color:#a0aba1;letter-spacing:.04em}@media(max-width:760px){.clips-v9{width:min(100% - 28px,1180px);padding-top:24px}.clips-v9-head{display:block}.clips-v9-head p{margin-top:12px}.clip-v9-card{border-radius:20px}.clip-v9-meta{padding:14px 16px;align-items:flex-start;flex-direction:column;gap:5px}}</style>`;
const CLIP_SECTION=`<div class="clips-v9" id="klip"><div class="clips-v9-head"><div><span class="eyebrow">klip / 01</span><h3>Gece vardiyasından.</h3></div><p>Bir round, biraz kaos. Lumos tarafından kısa bir Valorant anı.</p></div><article class="clip-v9-card"><div class="clip-v9-frame"><video controls playsinline preload="metadata" poster="./assets/clip_01_poster.jpg?v=8" aria-label="Lumos Valorant klibi"><source src="./assets/clip_01.mp4?v=8" type="video/mp4">Tarayıcınız video oynatmayı desteklemiyor.</video></div><div class="clip-v9-meta"><strong>Lumos Clip #01</strong><span>VALORANT · OMEN</span></div></article></div>`;
fetch('./legacy.html?v=8',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('legacy');return r.text()}).then(html=>{
  html=html.replace('</head>',CLIP_STYLE+'</head>');
  html=html.replace('<a href="#yayin">Yayın</a>','<a href="#klip">Klip</a><a href="#yayin">Yayın</a>');
  html=html.replace('<section class="section live" id="yayin">',CLIP_SECTION+'<section class="section live" id="yayin">');
  html=html.replace("navCta.textContent = '● LIVE'","navCta.textContent = '● Kick Yayında'");
  document.open();document.write(html);document.close();
}).catch(()=>{document.body.innerHTML='<div class="boot"><span>Site yüklenemedi. Lütfen sayfayı yenileyin.</span></div>'});
</script></body></html>
