const originals=new WeakMap();let current='tr';const preserve=(raw,newText)=>{const l=(raw.match(/^\\s*/)||[''])[0],r=(raw.match(/\\s*$/)||[''])[0];return l+newText+r};function txNode(n,lang){if(!n||n.nodeType!==3)return;const raw=n.nodeValue||'',t=raw.trim();if(!t)return;if(lang==='en'){if(D[t]){originals.set(n,raw);n.nodeValue=preserve(raw,D[t]);}}else if(originals.has(n)){n.nodeValue=originals.get(n);}}function walk(lang){const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){const p=n.parentElement;if(!p||/^(SCRIPT|STYLE|NOSCRIPT)$/.test(p.tagName)||p.closest('.lang-switch'))continue;txNode(n,lang);}}function setLang(lang){current=lang;document.documentElement.lang=lang;walk(lang);document.querySelectorAll('.lang-switch button').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));localStorage.setItem('sertacture_lang',lang);document.title=lang==='en'?'Sertaç Türe — Valorant, Outdoors & Live':'Sertaç Türe — Valorant, Doğa & Yayın';}function init(){const side=document.querySelector('.nav-side');if(side&&!document.querySelector('.lang-switch')){const box=document.createElement('div');box.className='lang-switch';box.setAttribute('aria-label','Dil / Language');box.innerHTML='<button type="button" data-lang="tr">TR</button><button type="button" data-lang="en">EN</button>';side.insertBefore(box,side.firstChild);box.addEventListener('click',e=>{const b=e.target.closest('button[data-lang]');if(b)setLang(b.dataset.lang);});}const saved=localStorage.getItem('sertacture_lang');setLang(saved==='en'?'en':'tr');const obs=new MutationObserver(ms=>{if(current!=='en')return;for(const m of ms){if(m.type==='characterData')txNode(m.target,'en');for(const a of m.addedNodes||[]){if(a.nodeType===3)txNode(a,'en');else if(a.nodeType===1){const w=document.createTreeWalker(a,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode())txNode(n,'en');}}}});obs.observe(document.body,{subtree:true,childList:true,characterData:true});}if(document.ready
