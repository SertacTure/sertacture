name: Finalize clean site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-site.yml'
      - '.site-payload/**'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and validate final files
        shell: bash
        run: |
          set -euo pipefail
          cat .site-payload/idx.00.b64 .site-payload/idx.01.b64 .site-payload/idx.02.b64 .site-payload/idx.03.b64 | base64 -d | gzip -d > index.html
          base64 -d < .site-payload/404.b64 | gzip -d > 404.html
          base64 -d < .site-payload/favicon.b64 | gzip -d > favicon.svg
          cat .site-payload/og.00.b64 .site-payload/og.01.b64 .site-payload/ogfix.00.b64 .site-payload/ogfix.01.b64 .site-payload/ogfix.02.b64 .site-payload/og.03.b64 | base64 -d | gzip -d > og_sertacture.png

          test "$(wc -c < index.html)" -eq 59471
          test "$(wc -c < 404.html)" -eq 2098
          test "$(wc -c < favicon.svg)" -eq 227
          test "$(wc -c < og_sertacture.png)" -eq 55795
          grep -q 'assets/clip_01.mp4' index.html
          grep -q 'lang-switch' index.html
          ! grep -q 'legacy.html' index.html
          ! grep -q 'clip-loader.js' index.html

          rm -f legacy.html clip-loader.js
          rm -rf .site-payload
          rm -f .github/workflows/finalize-site.yml

      - name: Commit final site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Finalize clean V9 site structure"
          git push
