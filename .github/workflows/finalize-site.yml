name: Finalize clean site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-site.yml'
      - '.site-payload/**'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build final files
        shell: bash
        run: |
          set -euo pipefail
          base64 -d < .site-payload/index.b64 | gzip -d > index.html
          base64 -d < .site-payload/404.b64 | gzip -d > 404.html
          base64 -d < .site-payload/favicon.b64 | gzip -d > favicon.svg
          cat .site-payload/og.*.b64 | base64 -d | gzip -d > og_sertacture.png
          rm -f legacy.html clip-loader.js
          rm -rf .site-payload
          rm -f .github/workflows/finalize-site.yml

      - name: Commit final site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Finalize clean V9 site structure"
          git push
